[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "claimscope"
version = "0.1.0"
description = "ClaimScope — vehicle claims portfolio intelligence backend using FastAPI and DuckDB."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "polars>=1.8,<2.0",
  "duckdb>=1.1,<2.0",
  "pyarrow>=17,<20",
  "pandas>=2.2,<3.0",
  "openpyxl>=3.1,<4.0",
  "scikit-learn>=1.5,<2.0",
  "numpy>=1.26,<3.0",
  "python-dotenv>=1.0,<2.0",
  "python-dateutil>=2.9,<3.0",
  "httpx>=0.27,<1.0",
]

[project.optional-dependencies]
model = [
  "joblib>=1.4,<2.0",
  "lightgbm>=4.5,<5.0",
]

dev = [
  "pytest>=8.3,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.6,<1.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "pipeline*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]

[tool.coverage.run]
source = ["backend/app", "pipeline"]
